name: Node.js Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  test:
    env:
      PORT: 3000

    strategy:
      matrix:
        node-version: [20, 22]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check application configuration
        run: echo "Application PORT is $PORT"

      - name: Create build info
        run: |
          echo "Commit SHA: $GITHUB_SHA" > build-info.txt
          echo "Node.js version: $(node --version)" >> build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-node-${{ matrix.node-version }}
          path: build-info.txt

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test